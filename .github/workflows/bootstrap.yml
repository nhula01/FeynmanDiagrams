name: Publish repository files
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/feynman_payload.tar.xz'
      - '.github/workflows/bootstrap.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack project
        run: |
          tar -xJf .bootstrap/feynman_payload.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit published files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Lindblad Feynman rules code and benchmarks"
          git push
